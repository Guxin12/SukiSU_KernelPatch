name: Build from build.sh

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          MAJOR=$(grep '#define MAJOR' version | awk '{print $3}')
          MINOR=$(grep '#define MINOR' version | awk '{print $3}')
          PATCH=$(grep '#define PATCH' version | awk '{print $3}')
          VERSION="\( {MAJOR}. \){MINOR}.${PATCH}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated Version: $VERSION"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            xxd \
            zlib1g-dev \
            build-essential \
            curl

      # ========== kpimg 专用：ARM GNU bare-metal 工具链 ==========
      - name: Install ARM GNU Toolchain (for kpimg)
        run: |
          TOOLCHAIN_URL="https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz"
          curl -L -o arm-gnu-toolchain.tar.xz "$TOOLCHAIN_URL"
          tar -Jxf arm-gnu-toolchain.tar.xz
          echo "ARM_TOOLCHAIN=$(pwd)/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf" >> $GITHUB_ENV
          echo "TARGET_COMPILE=$(pwd)/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-" >> $GITHUB_ENV
          # 验证
          $(pwd)/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-gcc --version | head -2

      # ========== Android userspace 工具：NDK ==========
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: false

      - name: Set NDK environment
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK ready at: $NDK_PATH"

      - name: Build kptools (Android)
        run: |
          cd tools
          rm -rf build
          mkdir -p build/android
          cd build/android
          cmake \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM=android-33 \
            -DANDROID_ABI=arm64-v8a \
            ../..
          cmake --build . -j$(nproc)
          mv kptools kptools-android
          echo "Built kptools-android"
          ls -la kptools-android

      - name: Build kptools (Linux)
        run: |
          cd tools/build
          cmake ..
          make -j$(nproc)
          mv kptools kptools-linux
          echo "Built kptools-linux"
          ls -la kptools-linux

      - name: Build kpimg (kernel) with ARM bare-metal toolchain
        run: |
          echo "TARGET_COMPILE=$TARGET_COMPILE"
          $TARGET_COMPILE gcc --version | head -1
          cd kernel
          make clean || true
          make -j$(nproc)
          ls -la kpimg
          file kpimg || true
          echo "Built kpimg successfully"

      - name: Prepare patch resources
        run: |
          mkdir -p patch/res
          rm -f patch/res/kpimg.enc patch/res/kpimg
          cp tools/build/android/kptools-android patch/res/
          cp tools/build/kptools-linux patch/res/
          cp kernel/kpimg patch/res/
          ls -la patch/res/

      - name: Generate headers & encrypt
        run: |
          cd patch
          g++ -o encrypt encrypt.cpp -O3 -std=c++17
          chmod +x ./encrypt
          ./encrypt res/kpimg res/kpimg.enc
          mkdir -p include
          xxd -i res/kpimg.enc > include/kpimg_enc.h
          xxd -i res/kptools-linux > include/kptools_linux.h
          xxd -i res/kptools-android > include/kptools_android.h
          ls -la include/

      - name: Build patch_android
        run: |
          cd patch
          rm -rf build-android
          mkdir -p build-android
          cd build-android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK}/build/cmake/android.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-33 \
            -DANDROID_STL=c++_static
          cmake --build . -j$(nproc)
          # 可能输出名为 patch_android 或 patch
          if [ -f patch_android ]; then
            cp -f patch_android ../../
          elif [ -f patch ]; then
            cp -f patch ../../patch_android
          fi
          ls -la ../.. | grep patch || true

      - name: Build patch_linux
        run: |
          cd patch
          rm -rf build-linux
          mkdir -p build-linux
          cd build-linux
          cmake ..
          make -j$(nproc)
          if [ -f patch ]; then
            mv patch patch_linux
            cp -f patch_linux ../../
          elif [ -f patch_linux ]; then
            cp -f patch_linux ../../
          fi
          ls -la ../.. | grep patch || true

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp -f kernel/kpimg dist/ 2>/dev/null || true
          cp -f tools/build/android/kptools-android dist/ 2>/dev/null || true
          cp -f tools/build/kptools-linux dist/ 2>/dev/null || true
          cp -f patch_android dist/ 2>/dev/null || true
          cp -f patch_linux dist/ 2>/dev/null || true
          echo "=== Artifacts ==="
          find dist -type f -exec ls -lh {} \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU_KernelPatch-${{ steps.version.outputs.VERSION }}
          path: |
            dist/
            kernel/kpimg
            tools/build/android/kptools-android
            tools/build/kptools-linux
            patch_android
            patch_linux
          if-no-files-found: warn
          retention-days: 30